version: 2

models:
  - name: stg_chart_of_accounts
    description: Chart of accounts, cleaned. One row per account.
    columns:
      - name: account_id
        tests:
          - unique
          - not_null

  - name: stg_gl_lines
    description: Journal lines, cleaned. One row per journal line.
    columns:
      - name: journal_id
        tests:
          - not_null
